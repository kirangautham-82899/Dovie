name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Offline checks for the pure logic (forecasts, predictions, tracker, mood × money).
      - run: npm run test:forecast
      - run: npm run test:predict
      - run: npm run test:tracker
      - run: npm run test:mood-money
      - run: npm run build
        env:
          # Placeholders: the build does not contact Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
